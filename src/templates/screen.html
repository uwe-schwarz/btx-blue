<section class="btx-screen-shell" aria-label="BTX Bildschirmtext Seite">
  <aside class="btx-settings-panel" aria-label="BTX Einstellungen">
    <form class="btx-settings" data-btx-baud-form>
      <fieldset class="btx-settings-group btx-settings-group--baud">
        <legend class="btx-settings-title">Verbindung · bit/s</legend>
        {{speeds}}
      </fieldset>
      <fieldset class="btx-settings-group">
        <legend class="btx-settings-title">BIT FLIP</legend>
        <label class="btx-toggle-option" for="btx-noise-enabled">
          <span class="btx-toggle-option__copy">
            <span class="btx-toggle-option__label">AKTIV</span>
          </span>
          <input id="btx-noise-enabled" class="btx-toggle-option__input" type="checkbox" role="switch" data-btx-noise-enabled />
        </label>
        <label class="btx-slider-control" for="btx-noise-level">
          <span class="btx-slider-control__copy">
            <span class="btx-slider-control__label">NOISE</span>
            <span class="btx-slider-control__value" data-btx-noise-value>2.0%</span>
          </span>
          <input
            id="btx-noise-level"
            class="btx-slider-control__input"
            type="range"
            min="0"
            max="10"
            step="0.1"
            value="2"
            data-btx-noise-level
          />
        </label>
      </fieldset>
    </form>
  </aside>
  <div class="btx-screen">
    <div class="btx-grid" data-btx-grid>
      {{headers}}
      {{body}}
      {{status}}
    </div>
  </div>
  {{search}}
</section>
